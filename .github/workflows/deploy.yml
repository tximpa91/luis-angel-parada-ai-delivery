name: Deploy Portfolio

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: Deploy the static Worker site to the existing luisangelparada.com domain
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ inputs.confirm_deploy }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Build Dockerized deployment toolchain
        run: docker build -f Dockerfile.deploy -t luis-angel-parada-ai-delivery-deploy:ci .

      - name: Verify the personal portfolio deployment target
        run: |
          docker run --rm --entrypoint node \
            -e CLOUDFLARE_API_TOKEN \
            -e CLOUDFLARE_ACCOUNT_ID \
            -e CLOUDFLARE_ZONE_ID \
            luis-angel-parada-ai-delivery-deploy:ci --input-type=module -e '
              const { CLOUDFLARE_API_TOKEN: token, CLOUDFLARE_ACCOUNT_ID: account, CLOUDFLARE_ZONE_ID: zoneId } = process.env;
              if (!token || !/^[0-9a-f]{32}$/.test(account || "") || !/^[0-9a-f]{32}$/.test(zoneId || "")) {
                throw new Error("Missing or invalid portfolio deployment configuration");
              }
              const response = await fetch(`https://api.cloudflare.com/client/v4/zones/${zoneId}`, {
                headers: { Authorization: `Bearer ${token}` },
              });
              const payload = await response.json();
              const zone = payload.result;
              if (!response.ok || !payload.success || zone?.name !== "luisangelparada.com"
                  || zone.account?.id !== account || zone.status !== "active") {
                throw new Error("Refusing deployment: credentials do not match the active personal portfolio zone");
              }
              console.log("Verified the active personal portfolio zone and account");
            '
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}

      - name: Deploy Worker code and static assets without changing domain infrastructure
        run: |
          docker run --rm \
            -e CLOUDFLARE_API_TOKEN \
            -e CLOUDFLARE_ACCOUNT_ID \
            -e VITE_CONTACT_EMAIL \
            --entrypoint sh luis-angel-parada-ai-delivery-deploy:ci -lc '
              npm run build && npm test && npm run deploy
            '
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VITE_CONTACT_EMAIL: ${{ secrets.VITE_CONTACT_EMAIL }}
