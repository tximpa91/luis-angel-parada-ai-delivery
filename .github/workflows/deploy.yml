name: Deploy Worker Container

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: Deploy the Worker container and connect luisangelparada.com
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ inputs.confirm_deploy }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Build Dockerized deployment toolchain
        run: docker build -f Dockerfile.deploy -t luis-angel-parada-ai-delivery-deploy:ci .

      - name: Deploy Worker, container, and custom domains
        run: |
          docker run --rm \
            -e CLOUDFLARE_API_TOKEN \
            -e CLOUDFLARE_ACCOUNT_ID \
            -e CLOUDFLARE_ZONE_ID \
            -e VITE_CONTACT_EMAIL \
            -v /var/run/docker.sock:/var/run/docker.sock \
            luis-angel-parada-ai-delivery-deploy:ci
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          VITE_CONTACT_EMAIL: ${{ secrets.VITE_CONTACT_EMAIL }}
