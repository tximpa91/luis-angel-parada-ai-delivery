name: Container CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        run: docker build --platform linux/amd64 -t luis-angel-parada-ai-delivery:ci .

      - name: Run container
        run: docker run --rm -d --name luis-angel-parada-site -p 8080:8080 luis-angel-parada-ai-delivery:ci

      - name: Verify health and page identity
        run: |
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8080/healthz; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8080/ | grep -F "Luis Angel Parada — AI Delivery Architect"

      - name: Show logs on failure
        if: failure()
        run: docker logs luis-angel-parada-site

      - name: Stop container
        if: always()
        run: docker stop luis-angel-parada-site || true
