name: Docker CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build production image
        run: docker build --platform linux/amd64 -t luis-angel-parada-ai-delivery:ci .

      - name: Build deployment toolchain
        run: docker build --platform linux/amd64 -f Dockerfile.deploy -t luis-angel-parada-deploy:ci .

      - name: Validate Worker static asset bundle
        run: |
          docker run --rm --entrypoint sh \
            -e VITE_CONTACT_EMAIL=portfolio@example.com \
            luis-angel-parada-deploy:ci -lc '
              npm run build &&
              npm run deploy -- --dry-run --outdir=/tmp/wrangler-dry-run
            '

      - name: Validate Terraform
        run: |
          docker run --rm --entrypoint sh luis-angel-parada-deploy:ci -lc '
            terraform -chdir=infra/terraform fmt -check -recursive &&
            terraform -chdir=infra/terraform init -backend=false -input=false &&
            terraform -chdir=infra/terraform validate
          '

      - name: Run container
        run: docker run --rm -d --name luis-angel-parada-site -p 8080:8080 luis-angel-parada-ai-delivery:ci

      - name: Verify health and page identity
        run: |
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8080/healthz; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8080/ | grep -F "I build the engineering systems behind ambitious digital products."
          curl --fail --silent http://127.0.0.1:8080/work/commerce-platform | grep -F "A commerce platform engineered for global scale."
          curl --fail --silent http://127.0.0.1:8080/work/applied-ai-product-discovery | grep -F "A safe pattern for conversational product discovery."
          curl --silent --output /dev/null --write-out '%{http_code}\n' http://127.0.0.1:8080/work/boutique-sales-assistant | grep -Fx "308"
          curl --fail --silent http://127.0.0.1:8080/ai-delivery | grep -F '<link rel="canonical" href="https://luisangelparada.com/ai-delivery"'
          curl --fail --silent http://127.0.0.1:8080/ai-delivery | grep -F 'id="seo-jsonld"'
          curl --silent --output /tmp/not-found.html --write-out '%{http_code}\n' http://127.0.0.1:8080/not-a-real-page | grep -Fx "404"
          grep -F 'name="robots" content="noindex, follow"' /tmp/not-found.html

      - name: Show logs on failure
        if: failure()
        run: docker logs luis-angel-parada-site

      - name: Stop container
        if: always()
        run: docker stop luis-angel-parada-site || true
